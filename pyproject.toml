[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaimenbell-rag-mcp"
version = "0.1.0"
readme = "README.md"
description = "Minimal, honest RAG-over-a-corpus MCP retrieval tool: search_knowledge(query, k) -> cited chunks. Local embeddings + embedded vector store. Auth-scoped, fail-soft, version-pinned."
requires-python = ">=3.12"
dependencies = [
    # 2.0.0 is the first release implementing protocol revision 2026-07-28.
    # Exact pin by policy; tests/test_protocol_version.py fails if this rolls back.
    "mcp==2.0.0",
    "chromadb==1.5.9",
    "PyYAML==6.0.3",
]

[project.scripts]
rag-mcp = "rag_mcp.__main__:main"

[project.optional-dependencies]
test = ["pytest==9.1.1"]
# RAG_MCP_EMBEDDER=bge path (BAAI/bge-large-en-v1.5, ONNX via fastembed). Not
# needed for the default MiniLM embedder -- install only when cutting over.
bge = ["fastembed==0.8.0"]

[tool.setuptools.packages.find]
include = ["rag_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
