name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # NOTE: no -q flag here -- pyproject.toml's addopts already applies -q,
      # and a second -q suppresses the final summary line the count gate parses.
      - name: Run test suite
        shell: bash
        run: python -m pytest 2>&1 | tee pytest-output.txt

      - name: Verify README test counts
        run: python scripts/check_readme_counts.py pytest-output.txt

      # Dependency CVE scan. WARN-ONLY on purpose: this is the first run, so
      # the baseline is unknown, and a known-unfixable finding is already
      # expected -- chromadb 1.5.9 carries CVE-2026-45829 with no patched
      # release available (see tests/test_embedded_only_invariant.py for why
      # it is unreachable in our embedded-only deployment). Gating now would
      # block every build on a finding we cannot act on.
      #
      # To gate later: drop continue-on-error, set exit-code to "1", and add
      # a .trivyignore entry for any accepted-risk CVE with a dated rationale.
      - name: Dependency vulnerability scan (warn-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "0"
